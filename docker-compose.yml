version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aetheria_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aetheria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: aetheria_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aetheria_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/aetheria
      - MONGODB_URI=mongodb://mongodb:27017/aetheria
      - JWT_SECRET=AETHERIA_MYSTIC_JWT_SECRET_KEY_FOR_LOCAL_DEV_0987654321
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static_volume:/app/static

volumes:
  pgdata:
  mongodata:
  static_volume:
